ignoreUntil = 2027-02-11
reason = "Fixed in echo v4.16.3 (CVE-2026-118651, GHSA-99jh-6h7p-pp36: v4 last affected 4.16.2); the Go DB entry has no v4 upper bound. echo is only linked by the Wails dev server (build tag dev)."
