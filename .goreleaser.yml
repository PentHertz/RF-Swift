# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

release:
  # GoReleaser evaluates this from the semantic version: tags containing a
  # prerelease component (for example v4.0.0-dev) become GitHub prereleases,
  # while v4.0.0 remains a normal release.
  prerelease: auto

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy -C go/rfswift
    # Shell completions + man pages bundled into the Linux packages (nfpms).
    - scripts/generate-packaging-assets.sh

builds:
  - env:
      - CGO_ENABLED=0
    dir: go/rfswift
    binary: rfswift
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - riscv64

archives:
  - format: tar.gz
    # This name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      rfswift_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else if eq .Arch "riscv64" }}riscv64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
      - src: scripts/install.sh
        dst: .
        strip_parent: true
      - src: scripts/common.sh
        dst: .
        strip_parent: true
      - src: lima/rfswift.yaml
        dst: lima/
        strip_parent: true
      - src: lima/rfswift-gpu.yaml
        dst: lima/
        strip_parent: true
    # Use zip for Windows archives
    format_overrides:
      - goos: windows
        format: zip

# Native Linux packages for the CLI/TUI: .deb (Debian/Ubuntu), .rpm
# (Fedora/RHEL/openSUSE) and .pkg.tar.zst (Arch, `pacman -U`). The GUI
# (rfswift-workbench) is a cgo binary built natively per-arch in its own CI
# jobs, so its packages are produced there by scripts/mkpackages.sh instead.
nfpms:
  - id: rfswift
    package_name: rfswift
    # Each ecosystem's native naming (rfswift_1.0.0_amd64.deb,
    # rfswift-1.0.0-1.x86_64.rpm, ...) instead of goreleaser's default.
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: PentHertz
    homepage: https://rfswift.io
    maintainer: PentHertz <contact@penthertz.com>
    license: GPL-3.0-only
    section: utils
    priority: optional
    bindir: /usr/bin
    description: |-
      RF and hardware security toolbox (CLI and TUI).
      Deploys ready-to-use radio and hardware security environments with
      working USB, audio and display passthrough, on top of Docker, Podman
      or native Nix environments, so the same tools run identically on any
      host distribution.
    formats:
      - deb
      - rpm
      - archlinux
    # A container engine OR Nix powers the environments; none of them is a
    # hard requirement, so weak dependencies only.
    overrides:
      deb:
        recommends:
          - docker.io | docker-ce | podman
      rpm:
        recommends:
          - (moby-engine or docker-ce or podman)
    contents:
      # Shell completions, generated by scripts/generate-packaging-assets.sh
      # (before-hook). Debian's zsh reads vendor-completions; Fedora and Arch
      # read site-functions. file_info pins each mode so the package never
      # inherits umask-dependent (e.g. group-writable) modes from the build.
      - src: packaging/cli/generated/completions/rfswift.bash
        dst: /usr/share/bash-completion/completions/rfswift
        file_info:
          mode: 0644
      - src: packaging/cli/generated/completions/_rfswift
        dst: /usr/share/zsh/vendor-completions/_rfswift
        packager: deb
        file_info:
          mode: 0644
      - src: packaging/cli/generated/completions/_rfswift
        dst: /usr/share/zsh/site-functions/_rfswift
        packager: rpm
        file_info:
          mode: 0644
      - src: packaging/cli/generated/completions/_rfswift
        dst: /usr/share/zsh/site-functions/_rfswift
        packager: archlinux
        file_info:
          mode: 0644
      - src: packaging/cli/generated/completions/rfswift.fish
        dst: /usr/share/fish/vendor_completions.d/rfswift.fish
        file_info:
          mode: 0644
      - src: packaging/cli/generated/man/*.1.gz
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/rfswift/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/rfswift/LICENSE
        packager: rpm
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/rfswift/LICENSE
        packager: archlinux
        file_info:
          mode: 0644

# Homebrew: no goreleaser brews/homebrew_casks section on purpose. The
# archives here hold UNSIGNED darwin binaries, and Homebrew quarantines cask
# downloads, so Gatekeeper would block them. The `rfswift` cask instead
# points at the signed + notarized universal .dmg (CLI + Workbench) and is
# rendered and pushed to PentHertz/homebrew-rfswift by the macOS DMG
# workflow after notarization succeeds (.github/workflows/macos-dmg.yml).

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
