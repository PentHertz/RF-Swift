# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "v3.0.0-dev" ]
  pull_request:
    branches: [ "main", "v3.0.0-dev" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Track the go directive in go.mod so toolchain security
        # patches (e.g. stdlib CVE fixes) apply by bumping one place.
        go-version-file: go/rfswift/go.mod
        cache-dependency-path: go/rfswift/go.sum

    - name: Build
      run: |
        cd go/rfswift
        go build -v ./...
    - name: Test
      run: |
        cd go/rfswift
        go test -v -race ./...
