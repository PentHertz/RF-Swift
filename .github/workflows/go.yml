# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        # Track the go directive in go.mod so toolchain security
        # patches (e.g. stdlib CVE fixes) apply by bumping one place.
        go-version-file: go/rfswift/go.mod
        cache-dependency-path: go/rfswift/go.sum

    - name: Build
      run: |
        cd go/rfswift
        go build -v .
    - name: Test
      run: |
        cd go/rfswift
        go test -v .
