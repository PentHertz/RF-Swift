name: Release

on:
  push:
    tags: ["v*"]


permissions:
  contents: write

jobs:
  # ---- Module audit gate ---------------------------------------------------
  # Runs the full modules audit (go.sum integrity, banned/deprecated
  # modules, govulncheck CVE scan, OSV malicious-package scan) before
  # anything is built or published. A release tag cannot ship if any
  # dependency is vulnerable, tampered with, or known-malicious.
  audit:
    name: Module audit gate
    permissions:
      contents: read
    uses: ./.github/workflows/modules-audit.yml

  # Build and test every Workbench target in this release run. The reusable
  # workflow still runs independently for branch and pull-request CI.
  workbench:
    name: Workbench builds
    needs: audit
    permissions:
      contents: read
    uses: ./.github/workflows/workbench.yml

  generate-artifacts:
    name: Generate cross-platform builds
    needs: [audit, workbench]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release (goreleaser)
      id-token: write      # Sigstore OIDC token for build provenance
      attestations: write  # write the artifact attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/rfswift/go.mod
          cache-dependency-path: go/rfswift/go.sum

      # Gate the release on the unit tests - a tag cannot ship if tests fail.
      - name: Run unit tests
        run: |
          cd go/rfswift
          go test -race ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sigstore-backed build provenance for the release artifacts. Users verify
      # with:  gh attestation verify <file> --repo PentHertz/RF-Swift
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt

  publish-workbench:
    name: Attach Workbench assets
    needs: generate-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download Workbench artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rfswift-workbench-*
          path: release-assets
          merge-multiple: true

      - name: Generate Workbench checksums
        run: |
          cd release-assets
          sha256sum rfswift-workbench_* > "RF-Swift_${GITHUB_REF_NAME#v}_workbench_checksums.txt"

      - name: Attest Workbench provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/rfswift-workbench_*

      - name: Upload Workbench assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
